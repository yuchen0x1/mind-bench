name: 问题反馈
description: 报告可复现的问题，请勿包含密钥或私人数据。
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 版本与环境
      placeholder: v0.2.1 / Windows 11 / Node.js 24 / Chrome
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期行为与实际结果
      description: 可附截图或脱敏日志，不要上传 API Key、数据库或私人回答。
    validations:
      required: true
