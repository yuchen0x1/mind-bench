name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_ID: ${{ github.sha }}
      BUILD_CHANNEL: stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version || !/^\d+\.\d+\.\d+$/.test(p.version)) process.exit(1)"
      - name: Install and build
        run: |
          npm ci
          npm run build
          npm run package:release -- release
      - name: Verify release download contents
        run: npm run verify:release -- release/mind-bench-$(node -p "require('./package.json').version").tar.gz
      - name: Extract release notes
        run: node scripts/release-notes.mjs > release/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/mind-bench-*.tar.gz release/SHA256SUMS.txt --verify-tag --title "MIND BENCH $RELEASE_TAG" --notes-file release/notes.md --latest
